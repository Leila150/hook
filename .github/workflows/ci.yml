name: HOOK CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install test tooling
        run: python -m pip install --upgrade pip pytest
      - name: Test HOOK source tree
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: python -m pytest -q
      - name: CLI smoke test
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: python -m hook.cli version

  source-check:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate HOOK source imports
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: python -m compileall -q src/hook
