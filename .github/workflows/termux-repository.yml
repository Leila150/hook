name: Build and publish Termux repository

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate HOOK runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-deps .
          python3 -m hook.cli --version
          python3 -m hook.cli -c 'print("Termux package smoke test")'

      - name: Build Termux .deb and APT repository
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(python3 - <<'PY'
          import re
          text = open("pyproject.toml", encoding="utf-8").read()
          match = re.search(r'^version\s*=\s*"([^"]+)"', text, re.M)
          if not match:
              raise SystemExit("Could not find project version")
          print(match.group(1))
          PY
          )"

          PKG="hook_${VERSION}_all.deb"
          ROOT="$PWD/pkgroot"
          rm -rf "$ROOT" repo "$PKG"

          # Debian/Termux packages must place files under usr/, not data/data/.
          mkdir -p \
            "$ROOT/DEBIAN" \
            "$ROOT/usr/opt/hook" \
            "$ROOT/usr/bin" \
            "$ROOT/usr/share/doc/hook"

          cp -a src/hook/. "$ROOT/usr/opt/hook/"

          cat > "$ROOT/usr/bin/hook" <<'SH'
          #!/data/data/com.termux/files/usr/bin/sh
          set -e
          PREFIX="${PREFIX:-/data/data/com.termux/files/usr}"
          export PYTHONPATH="$PREFIX/opt/hook${PYTHONPATH:+:$PYTHONPATH}"
          exec python -m hook.cli "$@"
          SH
          chmod 755 "$ROOT/usr/bin/hook"

          cp LICENSE "$ROOT/usr/share/doc/hook/LICENSE" 2>/dev/null || true

          cat > "$ROOT/DEBIAN/control" <<EOF
          Package: hook
          Version: ${VERSION}
          Section: devel
          Priority: optional
          Architecture: all
          Depends: python
          Maintainer: Leila150
          Homepage: https://github.com/Leila150/hook
          Description: HOOK programming language
           Easy, powerful, extensible and universal programming language.
          EOF

          dpkg-deb --build --root-owner-group "$ROOT" "$PKG"

          # Verify the package really contains the executable and runtime.
          dpkg-deb --contents "$PKG" | grep -F 'usr/bin/hook'
          dpkg-deb --contents "$PKG" | grep -F 'usr/opt/hook/'
          dpkg-deb --info "$PKG" | grep -F 'Package: hook'

          mkdir -p repo/pool/main/h/hook repo/dists/stable/main/binary-all
          cp "$PKG" repo/pool/main/h/hook/

          dpkg-scanpackages repo/pool/main /dev/null > repo/dists/stable/main/binary-all/Packages
          gzip -9cn repo/dists/stable/main/binary-all/Packages > repo/dists/stable/main/binary-all/Packages.gz

          PACKAGES_SIZE=$(stat -c%s repo/dists/stable/main/binary-all/Packages)
          PACKAGES_GZ_SIZE=$(stat -c%s repo/dists/stable/main/binary-all/Packages.gz)
          PACKAGES_SHA256=$(sha256sum repo/dists/stable/main/binary-all/Packages | cut -d' ' -f1)
          PACKAGES_GZ_SHA256=$(sha256sum repo/dists/stable/main/binary-all/Packages.gz | cut -d' ' -f1)

          cat > repo/dists/stable/Release <<EOF
          Origin: HOOK
          Label: HOOK
          Suite: stable
          Codename: stable
          Architectures: all
          Components: main
          Date: $(date -Ru)
          Description: HOOK Termux packages
          SHA256:
           ${PACKAGES_SHA256} ${PACKAGES_SIZE} main/binary-all/Packages
           ${PACKAGES_GZ_SHA256} ${PACKAGES_GZ_SIZE} main/binary-all/Packages.gz
          EOF

          cat > repo/index.html <<EOF
          <!doctype html>
          <html><head><meta charset="utf-8"><title>HOOK Termux Repository</title></head>
          <body>
            <h1>HOOK Termux Repository</h1>
            <p>Install HOOK with <code>pkg install hook</code> after adding this repository.</p>
            <p>Latest version: <strong>${VERSION}</strong></p>
          </body></html>
          EOF

      - name: Publish APT repository to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./repo
          force_orphan: true
