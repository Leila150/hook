[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hook-lang"
version = "0.1.0"
description = "HOOK programming language v0.1"
requires-python = ">=3.10"
license = {text = "MIT"}
readme = "README.md"
authors = [{name = "Leila150"}]

[project.scripts]
hook = "hook.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
