name: Build and publish Termux repository

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  PAGES_BASE_URL: https://leila150.github.io/hook
  HOOK_APT_GPG_EXPECTED_FINGERPRINT: FC62F98DC73F2D81C985CBE648719A987D3F1C3F

concurrency:
  group: hook-termux-repository
  cancel-in-progress: true

jobs:
  publish:
    name: Build, verify, and publish Termux APT repository
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Validate HOOK runtime
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/src"
          python -m hook.cli --version
          python -m hook.cli -c 'print("Termux package smoke test")'
          python -m compileall -q src/hook

      - name: Install packaging and signing tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev gnupg curl ca-certificates

      - name: Check package version against published repository
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/src"
          VERSION="$(python -c 'from hook.cli import VERSION; print(VERSION)')"
          echo "HOOK_VERSION=$VERSION" >> "$GITHUB_ENV"

          PUBLISHED_VERSION=""
          if curl --fail --silent --show-error --location --max-time 20 \
              "$PAGES_BASE_URL/dists/stable/main/binary-all/Packages" \
              -o "$RUNNER_TEMP/published-packages"; then
            PUBLISHED_VERSION="$(awk '$1 == "Version:" {print $2; exit}' "$RUNNER_TEMP/published-packages")"
          fi

          if [ -z "$PUBLISHED_VERSION" ]; then
            echo "No previously published HOOK package found; allowing initial publication of $VERSION."
          else
            echo "Current source version: $VERSION"
            echo "Published repository: $PUBLISHED_VERSION"
            if dpkg --compare-versions "$VERSION" le "$PUBLISHED_VERSION"; then
              echo "ERROR: HOOK package version $VERSION must be greater than published version $PUBLISHED_VERSION." >&2
              exit 1
            fi
            echo "Version check passed: $VERSION > $PUBLISHED_VERSION"
          fi

      - name: Import APT signing key
        shell: bash
        env:
          HOOK_APT_GPG_PRIVATE_KEY: ${{ secrets.HOOK_APT_GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${HOOK_APT_GPG_PRIVATE_KEY:-}" ]; then
            echo "ERROR: GitHub secret HOOK_APT_GPG_PRIVATE_KEY is not configured." >&2
            exit 1
          fi
          export GNUPGHOME="$RUNNER_TEMP/hook-gnupg"
          mkdir -m 700 -p "$GNUPGHOME"
          printf '%s\n' "$HOOK_APT_GPG_PRIVATE_KEY" | gpg --batch --import
          KEY_FINGERPRINT="$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "fpr" {print $10; exit}')"
          if [ -z "$KEY_FINGERPRINT" ]; then
            echo "ERROR: Could not determine imported GPG key fingerprint." >&2
            exit 1
          fi
          if [ "$KEY_FINGERPRINT" != "$HOOK_APT_GPG_EXPECTED_FINGERPRINT" ]; then
            echo "ERROR: Imported signing key fingerprint does not match the pinned repository key." >&2
            exit 1
          fi
          echo "HOOK_APT_GPG_FINGERPRINT=$KEY_FINGERPRINT" >> "$GITHUB_ENV"

      - name: Build Termux package and APT repository
        shell: bash
        env:
          HOOK_APT_GPG_PASSPHRASE: ${{ secrets.HOOK_APT_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/src"
          export GNUPGHOME="$RUNNER_TEMP/hook-gnupg"
          if [ -z "${HOOK_APT_GPG_PASSPHRASE:-}" ]; then
            echo "ERROR: GitHub secret HOOK_APT_GPG_PASSPHRASE is not configured." >&2
            exit 1
          fi

          PASSPHRASE_FILE="$RUNNER_TEMP/hook-apt-gpg-passphrase"
          umask 077
          printf '%s\n' "$HOOK_APT_GPG_PASSPHRASE" > "$PASSPHRASE_FILE"
          trap 'rm -f "$PASSPHRASE_FILE"' EXIT

          VERSION="$HOOK_VERSION"
          PKG="hook_${VERSION}_all.deb"
          ROOT="$PWD/pkgroot"
          PREFIX="/data/data/com.termux/files/usr"
          rm -rf "$ROOT" repo "$PKG"

          mkdir -p "$ROOT/DEBIAN" "$ROOT$PREFIX/share/hook" "$ROOT$PREFIX/bin" "$ROOT$PREFIX/share/doc/hook"
          chmod 755 "$ROOT/DEBIAN"
          cp -a src/hook/. "$ROOT$PREFIX/share/hook/"

          cat > "$ROOT$PREFIX/bin/hook" <<'SH'
#!/data/data/com.termux/files/usr/bin/sh
set -e
PREFIX="${PREFIX:-/data/data/com.termux/files/usr}"
export PYTHONPATH="$PREFIX/share/hook${PYTHONPATH:+:$PYTHONPATH}"
exec python -m hook.cli "$@"
SH
          chmod 755 "$ROOT$PREFIX/bin/hook"
          [ ! -f LICENSE ] || cp LICENSE "$ROOT$PREFIX/share/doc/hook/LICENSE"

          cat > "$ROOT/DEBIAN/control" <<EOF
Package: hook
Version: ${VERSION}
Section: devel
Priority: optional
Architecture: all
Depends: python:any
Maintainer: Leila150
Homepage: https://github.com/Leila150/hook
Description: HOOK programming language
 Easy, powerful, extensible and universal programming language.
EOF
          chmod 644 "$ROOT/DEBIAN/control"

          dpkg-deb --build --root-owner-group "$ROOT" "$PKG"
          dpkg-deb --info "$PKG" | grep -F "Version: ${VERSION}"
          dpkg-deb --info "$PKG" | grep -F "Architecture: all"
          dpkg-deb --contents "$PKG" | grep -F "./data/data/com.termux/files/usr/bin/hook"
          dpkg-deb --contents "$PKG" | grep -F "./data/data/com.termux/files/usr/share/hook/"
          if dpkg-deb --contents "$PKG" | grep -Eq '[[:space:]]\./usr(/|$)'; then
            echo "ERROR: package contains host-root ./usr" >&2
            exit 1
          fi
          DEB_SHA256="$(sha256sum "$PKG" | cut -d' ' -f1)"
          echo "HOOK_DEB_SHA256=$DEB_SHA256" >> "$GITHUB_ENV"

          mkdir -p repo/pool/main/h/hook repo/dists/stable/main/binary-all repo/dists/stable/main/binary-aarch64
          cp "$PKG" repo/pool/main/h/hook/
          (
            cd repo
            dpkg-scanpackages pool/main /dev/null > dists/stable/main/binary-all/Packages
          )
          gzip -9cn repo/dists/stable/main/binary-all/Packages > repo/dists/stable/main/binary-all/Packages.gz
          cp repo/dists/stable/main/binary-all/Packages repo/dists/stable/main/binary-aarch64/Packages
          cp repo/dists/stable/main/binary-all/Packages.gz repo/dists/stable/main/binary-aarch64/Packages.gz

          SHA_ALL="$(sha256sum repo/dists/stable/main/binary-all/Packages | cut -d' ' -f1)"
          SIZE_ALL="$(stat -c%s repo/dists/stable/main/binary-all/Packages)"
          GZSHA_ALL="$(sha256sum repo/dists/stable/main/binary-all/Packages.gz | cut -d' ' -f1)"
          GZSIZE_ALL="$(stat -c%s repo/dists/stable/main/binary-all/Packages.gz)"
          SHA_AARCH64="$(sha256sum repo/dists/stable/main/binary-aarch64/Packages | cut -d' ' -f1)"
          SIZE_AARCH64="$(stat -c%s repo/dists/stable/main/binary-aarch64/Packages)"
          GZSHA_AARCH64="$(sha256sum repo/dists/stable/main/binary-aarch64/Packages.gz | cut -d' ' -f1)"
          GZSIZE_AARCH64="$(stat -c%s repo/dists/stable/main/binary-aarch64/Packages.gz)"

          cat > repo/dists/stable/Release <<EOF
Origin: HOOK
Label: HOOK
Suite: stable
Codename: stable
Architectures: all aarch64
Components: main
Date: $(date -Ru)
Description: HOOK Termux packages
SHA256:
 ${SHA_ALL} ${SIZE_ALL} main/binary-all/Packages
 ${GZSHA_ALL} ${GZSIZE_ALL} main/binary-all/Packages.gz
 ${SHA_AARCH64} ${SIZE_AARCH64} main/binary-aarch64/Packages
 ${GZSHA_AARCH64} ${GZSIZE_AARCH64} main/binary-aarch64/Packages.gz
EOF

          gpg --batch --pinentry-mode loopback --passphrase-file "$PASSPHRASE_FILE" \
            --local-user "$HOOK_APT_GPG_FINGERPRINT" --clearsign \
            --output repo/dists/stable/InRelease repo/dists/stable/Release
          gpg --batch --pinentry-mode loopback --passphrase-file "$PASSPHRASE_FILE" \
            --local-user "$HOOK_APT_GPG_FINGERPRINT" --armor --detach-sign \
            --output repo/dists/stable/Release.gpg repo/dists/stable/Release

          gpg --batch --armor --export "$HOOK_APT_GPG_FINGERPRINT" > repo/hook-repo-key.asc
          chmod 644 repo/hook-repo-key.asc

          cat > repo/index.html <<EOF
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HOOK Termux Repository</title></head>
<body>
<h1>HOOK Termux Repository</h1>
<p>Install with <code>pkg install hook</code>.</p>
<p>Latest: <strong>${VERSION}</strong></p>
<p>APT signing key fingerprint: <code>${HOOK_APT_GPG_EXPECTED_FINGERPRINT}</code></p>
<p>Repository metadata: <a href="dists/stable/InRelease">InRelease</a> · <a href="dists/stable/Release">Release</a></p>
</body>
</html>
EOF
          chmod 644 repo/index.html

      - name: Verify repository before deployment
        shell: bash
        run: |
          set -euo pipefail
          export GNUPGHOME="$RUNNER_TEMP/hook-gnupg"
          DEB="repo/pool/main/h/hook/hook_${HOOK_VERSION}_all.deb"
          test -f "$DEB"
          test -s repo/index.html
          test -s repo/dists/stable/Release
          test -s repo/dists/stable/InRelease
          test -s repo/dists/stable/Release.gpg
          test -s repo/hook-repo-key.asc

          dpkg-deb --info "$DEB" | grep -F "Version: ${HOOK_VERSION}"
          dpkg-deb --info "$DEB" | grep -F "Architecture: all"
          test "$(sha256sum "$DEB" | cut -d' ' -f1)" = "$HOOK_DEB_SHA256"

          for p in repo/dists/stable/main/binary-all/Packages repo/dists/stable/main/binary-aarch64/Packages; do
            test -s "$p"
            grep -F "Package: hook" "$p"
            grep -F "Version: ${HOOK_VERSION}" "$p"
            grep -F "Architecture: all" "$p"
            grep -F "Filename: pool/main/h/hook/hook_${HOOK_VERSION}_all.deb" "$p"
            ! grep -Eq 'Filename: /|Filename: \./|repo/pool/' "$p"
          done

          for p in repo/dists/stable/main/binary-all/Packages repo/dists/stable/main/binary-all/Packages.gz repo/dists/stable/main/binary-aarch64/Packages repo/dists/stable/main/binary-aarch64/Packages.gz; do
            hash="$(sha256sum "$p" | cut -d' ' -f1)"
            grep -F "$hash" repo/dists/stable/Release
          done

          gpg --batch --verify repo/dists/stable/Release.gpg repo/dists/stable/Release
          gpg --batch --verify repo/dists/stable/InRelease
          EXPORTED_FINGERPRINT="$(gpg --batch --with-colons --import-options show-only --import repo/hook-repo-key.asc 2>/dev/null | awk -F: '$1 == "fpr" {print $10; exit}')"
          test "$EXPORTED_FINGERPRINT" = "$HOOK_APT_GPG_EXPECTED_FINGERPRINT"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ./repo

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      - name: Verify published Pages repository cryptographically
        shell: bash
        run: |
          set -euo pipefail
          LIVE="$RUNNER_TEMP/hook-live"
          LIVE_GNUPGHOME="$RUNNER_TEMP/hook-live-gnupg"
          rm -rf "$LIVE" "$LIVE_GNUPGHOME"
          mkdir -m 700 -p "$LIVE_GNUPGHOME"
          export GNUPGHOME="$LIVE_GNUPGHOME"

          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error --location --max-time 20 "$PAGES_BASE_URL/dists/stable/InRelease" -o "$LIVE/InRelease" && \
               curl --fail --silent --show-error --location --max-time 20 "$PAGES_BASE_URL/dists/stable/Release" -o "$LIVE/Release" && \
               curl --fail --silent --show-error --location --max-time 20 "$PAGES_BASE_URL/dists/stable/Release.gpg" -o "$LIVE/Release.gpg" && \
               curl --fail --silent --show-error --location --max-time 20 "$PAGES_BASE_URL/hook-repo-key.asc" -o "$LIVE/hook-repo-key.asc" && \
               curl --fail --silent --show-error --location --max-time 20 "$PAGES_BASE_URL/dists/stable/main/binary-all/Packages" -o "$LIVE/Packages" && \
               curl --fail --silent --show-error --location --max-time 20 "$PAGES_BASE_URL/dists/stable/main/binary-all/Packages.gz" -o "$LIVE/Packages.gz" && \
               curl --fail --silent --show-error --location --max-time 20 "$PAGES_BASE_URL/dists/stable/main/binary-aarch64/Packages" -o "$LIVE/Packages-aarch64" && \
               curl --fail --silent --show-error --location --max-time 20 "$PAGES_BASE_URL/dists/stable/main/binary-aarch64/Packages.gz" -o "$LIVE/Packages-aarch64.gz"; then
              break
            fi
            if [ "$attempt" -eq 18 ]; then
              echo "ERROR: GitHub Pages did not expose all repository metadata after deployment." >&2
              exit 1
            fi
            echo "Pages propagation check $attempt/18 not ready; retrying..."
            sleep 5
          done

          gpg --batch --import "$LIVE/hook-repo-key.asc"
          LIVE_FINGERPRINT="$(gpg --batch --with-colons --list-keys | awk -F: '$1 == "fpr" {print $10; exit}')"
          test "$LIVE_FINGERPRINT" = "$HOOK_APT_GPG_EXPECTED_FINGERPRINT"
          gpg --batch --verify "$LIVE/Release.gpg" "$LIVE/Release"
          gpg --batch --verify "$LIVE/InRelease"

          check_hash() {
            local file="$1"
            local release_path="$2"
            local expected actual
            expected="$(awk -v p="$release_path" '$2 == p {print $1; exit}' "$LIVE/Release")"
            test -n "$expected"
            actual="$(sha256sum "$file" | cut -d' ' -f1)"
            test "$actual" = "$expected"
          }
          check_hash "$LIVE/Packages" main/binary-all/Packages
          check_hash "$LIVE/Packages.gz" main/binary-all/Packages.gz
          check_hash "$LIVE/Packages-aarch64" main/binary-aarch64/Packages
          check_hash "$LIVE/Packages-aarch64.gz" main/binary-aarch64/Packages.gz

          grep -F "Package: hook" "$LIVE/Packages"
          grep -F "Version: ${HOOK_VERSION}" "$LIVE/Packages"
          grep -F "Architecture: all" "$LIVE/Packages"
          FILENAME="$(awk '/^Package: hook$/{found=1} found && /^Filename:/{print $2; exit}' "$LIVE/Packages")"
          test "$FILENAME" = "pool/main/h/hook/hook_${HOOK_VERSION}_all.deb"

          curl --fail --silent --show-error --location --max-time 30 \
            "$PAGES_BASE_URL/$FILENAME" -o "$LIVE/hook.deb"
          test -s "$LIVE/hook.deb"
          test "$(sha256sum "$LIVE/hook.deb" | cut -d' ' -f1)" = "$HOOK_DEB_SHA256"
          dpkg-deb --info "$LIVE/hook.deb" | grep -F "Version: ${HOOK_VERSION}"
          dpkg-deb --info "$LIVE/hook.deb" | grep -F "Architecture: all"
          echo "Live GitHub Pages repository, signatures, metadata hashes, and package verified successfully."
