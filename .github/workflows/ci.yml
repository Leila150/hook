name: HOOK CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test tooling
        run: python -m pip install pytest
      - name: Test HOOK source tree
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: python -m pytest
      - name: CLI smoke test
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: python -m hook.cli version

  source-check:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate HOOK source imports
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: python -m compileall -q src/hook
