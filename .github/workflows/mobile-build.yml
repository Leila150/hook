name: HOOK Mobile Builds

on:
  workflow_dispatch:
    inputs:
      source:
        description: HOOK source file to package
        required: true
        default: examples/hello.hk
        type: string
      build_android:
        description: Build Android APK
        required: false
        default: true
        type: boolean
      build_ios:
        description: Build iOS project
        required: false
        default: true
        type: boolean
  push:
    branches: [main]
    paths:
      - '**/*.hk'
      - 'src/hook/**'
      - '.github/workflows/mobile-build.yml'

permissions:
  contents: read

concurrency:
  group: hook-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_android }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Validate source input
        env:
          HOOK_SOURCE: ${{ inputs.source || 'examples/hello.hk' }}
        run: |
          set -euo pipefail
          case "$HOOK_SOURCE" in
            /*|../*|*/../*|*/.. ) echo "ERROR: source must stay inside the repository" >&2; exit 1 ;;
          esac
          test -f "$HOOK_SOURCE"
          case "$HOOK_SOURCE" in
            *.hk) ;;
            *) echo "ERROR: source must be a .hk file" >&2; exit 1 ;;
          esac
      - name: Generate Android project
        env:
          HOOK_SOURCE: ${{ inputs.source || 'examples/hello.hk' }}
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          from hook.mobile_compiler import AndroidCompiler
          source = os.environ['HOOK_SOURCE']
          project = Path(AndroidCompiler(package='hook.app', app_name='HOOK App').generate(source, 'build/android')).resolve()
          root = Path.cwd().resolve()
          if root not in project.parents and project != root:
              raise SystemExit(f'Generated project escaped workspace: {project}')
          required = [project / 'settings.gradle', project / 'build.gradle', project / 'app/build.gradle', project / 'app/src/main/AndroidManifest.xml']
          missing = [str(p) for p in required if not p.is_file()]
          if missing:
              raise SystemExit(f'Generated Android project is incomplete: {missing}')
          print(f'Generated Android project: {project}')
          PY
      - name: Build APK
        working-directory: build/android
        run: gradle --no-daemon --stacktrace assembleRelease
      - name: Verify APK artifact
        run: |
          set -euo pipefail
          apk="$(find build/android/app/build/outputs/apk -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          test -s "$apk"
          echo "APK: $apk"
      - name: Inspect APK contents
        run: |
          set -euo pipefail
          apk="$(find build/android/app/build/outputs/apk -type f -name '*.apk' -print -quit)"
          unzip -t "$apk" >/dev/null
          unzip -l "$apk" | grep -F 'AndroidManifest.xml' >/dev/null
          unzip -l "$apk" | grep -E 'classes[0-9]*\.dex' >/dev/null
      - name: Launch APK in Android emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: adb install -r "$(find build/android/app/build/outputs/apk -type f -name '*.apk' -print -quit)" && adb shell am start -n hook.app/.MainActivity && sleep 5 && adb shell dumpsys activity activities | grep -F 'hook.app/.MainActivity'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hook-android-apk
          path: build/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  ios:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_ios }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Validate source input
        env:
          HOOK_SOURCE: ${{ inputs.source || 'examples/hello.hk' }}
        run: |
          set -euo pipefail
          case "$HOOK_SOURCE" in
            /*|../*|*/../*|*/.. ) echo "ERROR: source must stay inside the repository" >&2; exit 1 ;;
          esac
          test -f "$HOOK_SOURCE"
          case "$HOOK_SOURCE" in
            *.hk) ;;
            *) echo "ERROR: source must be a .hk file" >&2; exit 1 ;;
          esac
      - name: Generate iOS project bundle
        env:
          HOOK_SOURCE: ${{ inputs.source || 'examples/hello.hk' }}
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          from hook.mobile_compiler import IOSCompiler
          source = os.environ['HOOK_SOURCE']
          project = Path(IOSCompiler(bundle_id='com.hook.app', app_name='HOOK App').generate(source, 'build/ios')).resolve()
          root = Path.cwd().resolve()
          if root not in project.parents and project != root:
              raise SystemExit(f'Generated project escaped workspace: {project}')
          required = [project / 'README.md', project / 'PROJECT_STATUS.txt', project / 'HOOK_App' / 'HOOKApp.swift', project / 'HOOK_App.xcodeproj' / 'project.pbxproj']
          missing = [str(p) for p in required if not p.is_file()]
          if missing:
              raise SystemExit(f'Generated iOS project bundle is incomplete: {missing}')
          print(f'Generated iOS project bundle: {project}')
          PY
      - name: Validate and compile Xcode project
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild -project build/ios/HOOK_App.xcodeproj -list
          xcodebuild -project build/ios/HOOK_App.xcodeproj \
            -scheme HOOK_App \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
      - name: Package iOS project artifact
        run: ditto -c -k --sequesterRsrc --keepParent build/ios build/HOOK-iOS-project.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hook-ios-project
          path: build/HOOK-iOS-project.zip
          if-no-files-found: error
