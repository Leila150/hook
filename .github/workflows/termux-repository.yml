name: Build and publish Termux repository

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: termux-repository
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate HOOK runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-deps .
          python3 -m hook.cli --version
          python3 -m hook.cli -c 'print("Termux package smoke test")'

      - name: Install packaging tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev

      - name: Build Termux .deb and APT repository
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(python3 - <<'PY'
          import re
          text = open("pyproject.toml", encoding="utf-8").read()
          match = re.search(r'^version\s*=\s*"([^"]+)"', text, re.M)
          if not match:
              raise SystemExit("Could not find project version")
          print(match.group(1))
          PY
          )"
          echo "HOOK_VERSION=$VERSION" >> "$GITHUB_ENV"

          PKG="hook_${VERSION}_all.deb"
          ROOT="$PWD/pkgroot"
          TERMUX_PREFIX="/data/data/com.termux/files/usr"
          rm -rf "$ROOT" repo "$PKG"

          # Termux's dpkg installs packages into the Android app prefix.
          # Do NOT use /usr here: that is the Android filesystem root and is read-only.
          mkdir -p \
            "$ROOT/DEBIAN" \
            "$ROOT$TERMUX_PREFIX/opt/hook" \
            "$ROOT$TERMUX_PREFIX/bin" \
            "$ROOT$TERMUX_PREFIX/share/doc/hook"

          cp -a src/hook/. "$ROOT$TERMUX_PREFIX/opt/hook/"

          cat > "$ROOT$TERMUX_PREFIX/bin/hook" <<'SH'
          #!/data/data/com.termux/files/usr/bin/sh
          set -e
          PREFIX="${PREFIX:-/data/data/com.termux/files/usr}"
          export PYTHONPATH="$PREFIX/opt/hook${PYTHONPATH:+:$PYTHONPATH}"
          exec python -m hook.cli "$@"
          SH
          chmod 755 "$ROOT$TERMUX_PREFIX/bin/hook"

          if [ -f LICENSE ]; then
            cp LICENSE "$ROOT$TERMUX_PREFIX/share/doc/hook/LICENSE"
          fi

          cat > "$ROOT/DEBIAN/control" <<EOF
          Package: hook
          Version: ${VERSION}
          Section: devel
          Priority: optional
          Architecture: all
          Depends: python
          Maintainer: Leila150
          Homepage: https://github.com/Leila150/hook
          Description: HOOK programming language
           Easy, powerful, extensible and universal programming language.
          EOF

          dpkg-deb --build --root-owner-group "$ROOT" "$PKG"

          echo "Package contents:"
          dpkg-deb --contents "$PKG"

          # Hard fail if the package contains paths that would target the host /usr.
          if dpkg-deb --contents "$PKG" | grep -Eq '^[-dlcbprwx]+[[:space:]]+[0-9]+[[:space:]]+[0-9]+/[0-9]+[[:space:]]+.*[[:space:]]\./usr(/|$)'; then
            echo "ERROR: package contains a host-root ./usr path" >&2
            exit 1
          fi

          dpkg-deb --contents "$PKG" | grep -F "./data/data/com.termux/files/usr/bin/hook"
          dpkg-deb --contents "$PKG" | grep -F "./data/data/com.termux/files/usr/opt/hook/"
          dpkg-deb --info "$PKG" | grep -F 'Package: hook'
          dpkg-deb --info "$PKG" | grep -F 'Architecture: all'
          dpkg-deb --info "$PKG" | grep -F 'Depends: python'

          mkdir -p repo/pool/main/h/hook repo/dists/stable/main/binary-all
          cp "$PKG" repo/pool/main/h/hook/

          (
            cd repo
            dpkg-scanpackages pool/main /dev/null > dists/stable/main/binary-all/Packages
            gzip -9cn dists/stable/main/binary-all/Packages > dists/stable/main/binary-all/Packages.gz
          )

          PACKAGES_SIZE=$(stat -c%s repo/dists/stable/main/binary-all/Packages)
          PACKAGES_GZ_SIZE=$(stat -c%s repo/dists/stable/main/binary-all/Packages.gz)
          PACKAGES_SHA256=$(sha256sum repo/dists/stable/main/binary-all/Packages | cut -d' ' -f1)
          PACKAGES_GZ_SHA256=$(sha256sum repo/dists/stable/main/binary-all/Packages.gz | cut -d' ' -f1)

          cat > repo/dists/stable/Release <<EOF
          Origin: HOOK
          Label: HOOK
          Suite: stable
          Codename: stable
          Architectures: all
          Components: main
          Date: $(date -Ru)
          Description: HOOK Termux packages
          SHA256:
           ${PACKAGES_SHA256} ${PACKAGES_SIZE} main/binary-all/Packages
           ${PACKAGES_GZ_SHA256} ${PACKAGES_GZ_SIZE} main/binary-all/Packages.gz
          EOF

          cat > repo/index.html <<EOF
          <!doctype html>
          <html><head><meta charset="utf-8"><title>HOOK Termux Repository</title></head>
          <body>
            <h1>HOOK Termux Repository</h1>
            <p>Install HOOK with <code>pkg install hook</code> after adding this repository.</p>
            <p>Latest version: <strong>${VERSION}</strong></p>
          </body></html>
          EOF

      - name: Verify APT repository and package paths
        shell: bash
        run: |
          set -euo pipefail

          DEB="repo/pool/main/h/hook/hook_${HOOK_VERSION}_all.deb"
          PACKAGES="repo/dists/stable/main/binary-all/Packages"

          test -f "$DEB"
          test -s "$PACKAGES"
          test -s "${PACKAGES}.gz"

          grep -F "Filename: pool/main/h/hook/hook_${HOOK_VERSION}_all.deb" "$PACKAGES"

          if grep -Fq "repo/pool/" "$PACKAGES"; then
            echo "ERROR: Packages contains an incorrect repo/ prefix" >&2
            exit 1
          fi

          if grep -Eq 'Filename: /|Filename: \./' "$PACKAGES"; then
            echo "ERROR: Packages contains an absolute or ./ Filename" >&2
            exit 1
          fi

          # Validate that the exact archive referenced by Packages is readable.
          python3 - <<'PY'
          from pathlib import Path
          import re

          packages = Path("repo/dists/stable/main/binary-all/Packages").read_text(encoding="utf-8")
          match = re.search(r"^Filename: (.+)$", packages, re.M)
          if not match:
              raise SystemExit("Packages has no Filename entry")
          archive = Path("repo") / match.group(1)
          if not archive.is_file():
              raise SystemExit(f"APT Filename does not resolve to a file: {archive}")
          print(f"Verified APT archive: {archive}")
          PY

          # Ensure Release hashes exactly match the generated metadata.
          grep -F "$(sha256sum "$PACKAGES" | cut -d' ' -f1)" repo/dists/stable/Release
          grep -F "$(sha256sum "${PACKAGES}.gz" | cut -d' ' -f1)" repo/dists/stable/Release

      - name: Publish APT repository to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./repo
          force_orphan: true
