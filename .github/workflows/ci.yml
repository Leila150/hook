name: HOOK CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: hook-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install test tooling
        run: python -m pip install "pytest==9.1.1"
      - name: Test HOOK source tree
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: python -m pytest -q
      - name: CLI smoke test
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: python -m hook.cli version

  source-check:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Validate HOOK source imports
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: python -m compileall -q src/hook
